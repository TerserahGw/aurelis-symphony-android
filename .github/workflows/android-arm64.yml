name: Android ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-arm64.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "Android SDK is unavailable on runner"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurelisSymphony-Android-ARM64-v0.1.0-beta
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish GitHub Release v0.1.0 Beta
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" AurelisSymphony-Android-arm64-v0.1.0-beta.apk
          if ! gh release view v0.1.0-beta >/dev/null 2>&1; then
            gh release create v0.1.0-beta --target "$GITHUB_SHA" \
              --title "Aurelis Symphony Android v0.1.0 Beta" \
              --notes "Kotlin Android ARM64 beta: refreshed Ambient Glass, frosted island capsules, drag-follow navigation highlight, anchored song menus, lyric word glow and progress trail. Debug-signed APK intended for testing." \
              --prerelease
          fi
          gh release upload v0.1.0-beta AurelisSymphony-Android-arm64-v0.1.0-beta.apk --clobber
