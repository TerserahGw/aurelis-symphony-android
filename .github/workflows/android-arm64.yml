name: Android ARM64 APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-arm64.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-arm64.yml'

concurrency:
  group: aurelis-android-release-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          test -n "${ANDROID_HOME:-}"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Build debug APK for test
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload test APK (signing varies per runner)
        uses: actions/upload-artifact@v4
        with:
          name: AurelisSymphony-ARM64-v1.2.14-TEST-DEBUG
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Required once: 4 encrypted GitHub Actions secrets. Never upload a
      # signing keystore to the source tree or publish a random debug key.
      - name: Prepare persistent signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.AURELIS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AURELIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AURELIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AURELIS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] ||
             [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed release withheld until AURELIS_KEYSTORE_* and AURELIS_KEY_* secrets are set."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aurelis-release.jks"
          chmod 600 "$RUNNER_TEMP/aurelis-release.jks"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build stable-signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          AURELIS_SIGNING_STORE_FILE: ${{ runner.temp }}/aurelis-release.jks
          AURELIS_SIGNING_STORE_PASSWORD: ${{ secrets.AURELIS_KEYSTORE_PASSWORD }}
          AURELIS_SIGNING_KEY_ALIAS: ${{ secrets.AURELIS_KEY_ALIAS }}
          AURELIS_SIGNING_KEY_PASSWORD: ${{ secrets.AURELIS_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"

      - name: Upload signed release artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AurelisSymphony-ARM64-v1.2.14-SIGNED
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release v1.2.14 Stable
        if: steps.signing.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk \
            AurelisSymphony-Android-arm64-v1.2.14.apk
          if ! gh release view v1.2.14 >/dev/null 2>&1; then
            gh release create v1.2.14 --target "$GITHUB_SHA" \
              --title "Aurelis Symphony Android v1.2.14 Stable" \
              --notes "Aurelis Symphony Android v1.2.14 Stable. Fixed right-side landscape navigation layout: Search capsule now sits above the right vertical navigation rail while mini player appears immediately to its left. In right mode, Search expands leftward and mini player smoothly morphs down to centered cover; in left mode, Search expands rightward as before. A single mirrored floating top-dock tracks the same saved Kiri/Kanan setting and three-finger gesture as both rails, with spring side travel and fade/slide content reordering. Uses bounded coordinates to avoid negative padding, retains v1.2.13 crash fix, restored spring zoom and blur player effects, right-side popup pivot, artwork and widgets. Signed release versionCode 23."
          fi
          gh release upload v1.2.14 \
            AurelisSymphony-Android-arm64-v1.2.14.apk --clobber
